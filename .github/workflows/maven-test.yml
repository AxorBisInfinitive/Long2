name: Maven Test

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ap/pom.xml
      - name: Install annotation processor
        run: mvn -B -ntp -f ap/pom.xml install
      - name: Run Maven tests
        run: mvn -B -ntp test
